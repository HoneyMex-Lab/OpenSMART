[project]
name = "opensmart-backend"
version = "0.2.0"
description = "OpenSMART prototype FastAPI backend"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "argon2-cffi==23.1.0",
    "pydantic==2.11.7",
    "psutil>=5.9",
    "maxminddb>=2.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
