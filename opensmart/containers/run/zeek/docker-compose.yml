services:
  zeek:
    # Built by opensmart.sh (install/recreate) against the real host Docker
    # daemon, not by the backend's provisioning.py — the docker-socket-proxy
    # it talks through has BUILD disabled on purpose (see
    # docs/architecture.md). This build: section is for manual
    # `docker compose build`/`up --build` use only; it also needs
    # opensmart/base built first (containers/build/base/).
    build:
      context: ../../../../containers/build/zeek
      dockerfile: Dockerfile
    image: opensmart/zeek
    container_name: opensmart-zeek
    hostname: zeek
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./volumes/data:/data
    working_dir: /data
    restart: unless-stopped
