services:
  opensmart:
    build:
      context: ../../../..
      dockerfile: containers/build/opensmart/Dockerfile
    image: opensmart/web
    container_name: opensmart
    hostname: opensmart
    volumes:
      # Host-path parity, not a fixed /opt path: the project's opensmart/
      # directory is mounted at the SAME absolute path inside the container
      # as it has on the host. opensmart.sh always exports
      # OPENSMART_PROJECT_DIR (an absolute path) before invoking `docker
      # compose`; running compose directly requires exporting it yourself,
      # e.g. `export OPENSMART_PROJECT_DIR="$(cd ../../.. && pwd)"`. This is
      # what lets sibling-container bind mounts under containers/run/*/
      # (resolved by `docker compose` running inside this container, but
      # applied by the host daemon via docker-socket-proxy) point at real
      # host paths instead of a path that only exists inside this container.
      - ${OPENSMART_PROJECT_DIR:?Set OPENSMART_PROJECT_DIR to the absolute host path of the opensmart/ directory}:${OPENSMART_PROJECT_DIR:?}
    working_dir: ${OPENSMART_PROJECT_DIR:?}
    ports:
      # Loopback-only: the app is no longer reachable from the network
      # directly — the front-door proxy (containers/run/nginx/) is the only
      # externally-reachable entry point (published on 80/443, reaching this
      # container via the internal "opensmart" Docker network, not through
      # this port mapping at all). Still reachable at http://127.0.0.1:8000
      # from the host itself (installer health checks use "localhost", which
      # resolves here) for local debugging. This is the HOST-side publish
      # address only — inside its own network namespace the app still binds
      # 0.0.0.0 (see command: below), which it must for Docker's own
      # bridge-network port forwarding to reach it at all.
      - "127.0.0.1:8000:8000"
    environment:
      # Sibling-container provisioning (Wizard installer, native Suricata
      # toggle) talks to the host Docker daemon through this restricted
      # proxy instead of a raw docker.sock mount.
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # uv's package cache defaults to the container's own home directory,
      # which is NOT bind-mounted — so it's wiped every time the container
      # is recreated, and a fresh `uv sync` has to re-fetch every backend
      # package from PyPI from scratch every time, even if it already
      # succeeded before. Pointing it at a path inside the already
      # bind-mounted project directory (no separate volume entry needed —
      # this path is already covered by the mount above) makes successful
      # downloads persist across container recreations, so a slow/flaky
      # network on the host only ever has to succeed once.
      - UV_CACHE_DIR=${OPENSMART_PROJECT_DIR:?}/.uv-cache
      # Written into this project's .env by opensmart.sh's
      # _install_check_host_resources (install-time only) — surfaced to the
      # Wizard via GET /api/provisioning/host-resources so it can warn about
      # and de-prioritize resource-heavy tools/modules on constrained hosts.
      # Defaults assume "full" capability (unconstrained) for dev/manual
      # `docker compose up` runs that skip the installer.
      - OPENSMART_RESOURCE_TIER=${OPENSMART_RESOURCE_TIER:-full}
      - OPENSMART_RESOURCE_CPU=${OPENSMART_RESOURCE_CPU:-0}
      - OPENSMART_RESOURCE_MEM_MB=${OPENSMART_RESOURCE_MEM_MB:-0}
      - OPENSMART_RESOURCE_DISK_GB=${OPENSMART_RESOURCE_DISK_GB:-0}
      - OPENSMART_RESOURCE_CONSTRAINED_TOOLS=${OPENSMART_RESOURCE_CONSTRAINED_TOOLS:-}
      - OPENSMART_RESOURCE_CONSTRAINED_MODULES=${OPENSMART_RESOURCE_CONSTRAINED_MODULES:-}
    depends_on:
      - docker-socket-proxy
    networks:
      - opensmart
    restart: always
    command: ["./opensmart.sh", "start", "--bind", "0.0.0.0:8000", "--prod"]

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: opensmart-docker-proxy
    environment:
      # Explicit allowlist: only what container provisioning needs. `docker
      # compose` queries the /volumes API as part of its normal project
      # reconciliation even for bind-mount-only projects (confirmed via
      # docker-socket-proxy access logs — it 403'd on GET /volumes without
      # this), so VOLUMES has to be on despite none of our containers using
      # named volumes. Everything else (EXEC, BUILD, SWARM, SECRETS,
      # SERVICES, PLUGINS, CONFIGS, SESSION, DISTRIBUTION, SYSTEM, AUTH)
      # stays off.
      - CONTAINERS=1
      - NETWORKS=1
      - IMAGES=1
      - VOLUMES=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - opensmart
    restart: unless-stopped
    # No ports published — reachable only from the opensmart network.

networks:
  opensmart:
    external: true
    name: opensmart
