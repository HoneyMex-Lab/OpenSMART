# Arkime's webBasePath=/arkime/ (see ./etc/config.ini) scopes its session/
# CSRF cookie to that path, so a request to the bare root "/" fails
# Arkime's own path validation with a raw, unexplained "400 Bad Request" —
# confirmed live: GET / (after passing digest auth) -> 400 straight from
# Arkime's own access log, no proxy involved. That's how webBasePath has
# always behaved upstream; it isn't something this config can change in
# Arkime itself. This is a tiny, static (no envsubst needed) nginx sitting
# in FRONT of the real viewer's own port so a plain http://<host>:8005/
# request — the URL convention from before webBasePath existed — gets a
# clean redirect instead of a confusing dead end, while everything already
# using the correct /arkime/ prefix (direct or through the OpenSMART
# front-door proxy) passes straight through unmodified.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8005;
    client_max_body_size 0;

    location = / {
        return 302 /arkime/;
    }

    location / {
        proxy_pass http://viewer:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
