[default]
### OpenSearch backend (overridden per-service via ARKIME__elasticsearch env)
elasticsearch=http://localhost:9200

### Capture interface
interface=eth0
snapLen=32768
pcapReadMethod=libpcap
pcapBufferSize=33554432
parsersDir=/opt/arkime/parsers
pluginsDir=/opt/arkime/plugins

### PCAP storage (inside mounted /data volume)
pcapDir=/data/raw

### Processing (host has 8GB RAM / 6 vCPU)
packetThreads=2
### OUI/RIR/GeoIP enrichment files are not bundled in the image.
### To enable, run inside the container: /opt/arkime/bin/arkime_update_geo.sh
### then set ouiFile/rirFile/geoLite2* accordingly.

### Drop privileges
dropUser=nobody
dropGroup=daemon

### Served under the OpenSMART front-door proxy at /arkime/ (see
### containers/run/nginx/). webBasePath makes the viewer emit correct
### absolute links under that prefix so it renders inside the OpenSMART
### iframe. Must start and end with '/'. With this set, the viewer lives
### under the prefix on the published port too, i.e. direct access is
### http://<host>:8005/arkime/ (not the bare root).
webBasePath=/arkime/
