services:
  # Arkime's image runs its capture/viewer processes as root, which normally
  # has no trouble writing to a bind-mounted ./volumes/data regardless of its
  # host-side owner — real root bypasses Unix permission checks. That
  # assumption broke on a host where the Docker daemon itself runs inside an
  # unprivileged container (observed: capture's "root"
  # resolved to a UID that is NOT actually privileged against the host
  # filesystem, so `mkdir /data/raw` failed with Permission denied and the
  # capture container crash-looped — RestartCount in the thousands, exiting
  # cleanly each time rather than crashing, which is why `restart:
  # unless-stopped` kept it alive but never working). This one-off container
  # normalizes /data's permissions before capture/viewer start, so it works
  # the same way regardless of what "root" actually means on the host.
  init-data-dir:
    image: busybox
    command: ["sh", "-c", "mkdir -p /data/raw && chmod -R 0777 /data"]
    volumes:
      - ./volumes/data:/data
    restart: "no"

  # Arkime's own docker.sh --add-admin flag (deliberately unused below)
  # hardcodes the created user's password to the literal string "admin".
  # This one-off container upserts the admin user via the same addUser.js
  # the image ships, with a real password from ARKIME_ADMIN_PASSWORD
  # (override via .env; the fallback below MUST be changed before exposing
  # this to any untrusted network — see docs/security.md). Retries
  # addUser.js itself (rather than probing for a specific OpenSearch index
  # name) until the users template capture's db-init step creates is
  # ready, so it doesn't depend on Arkime's internal index-naming scheme.
  #
  # Once the admin exists, it also sets that user's default UI theme to
  # "Green on Black" (Arkime's own name for the dark-2-theme value — see the
  # theme list in the viewer bundle). addUser.js replaces the whole user
  # document, so it resets settings.theme every time it runs; the painless
  # step re-seeds the default afterwards (set-only-if-unset). provisioning.py's
  # sync_arkime_password does the same after its own addUser, so a UI password
  # change doesn't drop the theme either. A theme the user picks in the UI
  # persists until the next time the admin user is (re)created.
  init-admin-user:
    image: ghcr.io/arkime/arkime/arkime:v6-latest
    hostname: arkime-init-admin
    entrypoint: ["bash", "-c"]
    environment:
      - ARKIME__elasticsearch=http://opensearch:9200
      - ARKIME_ADMIN_PASSWORD=${ARKIME_ADMIN_PASSWORD:-changeme-arkime-admin}
    command:
      - >-
        cd /opt/arkime/viewer;
        for i in $(seq 1 60); do
          if /opt/arkime/bin/node addUser.js admin "OpenSMART Admin" "$$ARKIME_ADMIN_PASSWORD" --admin; then
            curl -s -XPOST "http://opensearch:9200/arkime_users/_update/admin" -H "Content-Type: application/json" -d '{"script":{"lang":"painless","source":"if(ctx._source.settings==null){ctx._source.settings=[:];} if(ctx._source.settings.theme==null){ctx._source.settings.theme=params.t;}","params":{"t":"dark-2-theme"}}}' || true;
            exit 0;
          fi;
          echo "waiting for Arkime users index to be ready ($$i/60)...";
          sleep 5;
        done;
        echo "gave up waiting for the Arkime users index";
        exit 1
    volumes:
      - ./etc/config.ini:/opt/arkime/etc/config.ini
    networks:
      - opensmart
    depends_on:
      capture:
        condition: service_started
    restart: "no"

  # Capture sniffs eth0 -> must use host networking (like Zeek/Suricata).
  capture:
    image: ghcr.io/arkime/arkime/arkime:v6-latest
    container_name: opensmart-arkime-capture
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_RESOURCE
    command: /opt/arkime/bin/docker.sh capture --wait-for-db http://localhost:9200 --db 'http://localhost:9200 init --ifneeded' -- -n opensmart
    environment:
      - ARKIME__elasticsearch=http://localhost:9200
    volumes:
      - ./etc/config.ini:/opt/arkime/etc/config.ini
      - ./volumes/data:/data
    depends_on:
      init-data-dir:
        condition: service_completed_successfully
    restart: unless-stopped

  # Viewer UI, reaches OpenSearch by service alias. No direct port publish —
  # see viewer-redirect below, which is what actually owns host port 8005
  # now (needed for webBasePath's bare-root behavior, see redirect.conf).
  viewer:
    image: ghcr.io/arkime/arkime/arkime:v6-latest
    container_name: opensmart-arkime-viewer
    hostname: arkime-viewer
    command: /opt/arkime/bin/docker.sh viewer --wait-for-db http://opensearch:9200 -- -n opensmart
    environment:
      - ARKIME__elasticsearch=http://opensearch:9200
    volumes:
      - ./etc/config.ini:/opt/arkime/etc/config.ini
      - ./volumes/data:/data
    networks:
      - opensmart
    depends_on:
      init-data-dir:
        condition: service_completed_successfully
    restart: unless-stopped

  # Owns the published host port; redirects the bare root to /arkime/ and
  # passes everything else straight through to viewer. See redirect.conf.
  viewer-redirect:
    image: nginx:1.27
    container_name: opensmart-arkime-viewer-redirect
    hostname: arkime-viewer-redirect
    volumes:
      - ./redirect.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8005:8005"
    networks:
      - opensmart
    depends_on:
      - viewer
    restart: unless-stopped

networks:
  opensmart:
    external: true
    name: opensmart
