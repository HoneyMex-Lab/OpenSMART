services:
  wireguard:
    # Built by opensmart.sh (install/recreate) against the real host Docker
    # daemon, not by the backend's provisioning.py — the docker-socket-proxy
    # it talks through has BUILD disabled on purpose (see
    # docs/architecture.md). This build: section is for manual
    # `docker compose build`/`up --build` use only; it also needs
    # opensmart/base built first (containers/build/base/).
    build:
      context: ../../../../containers/build/wireguard
      dockerfile: Dockerfile
    image: opensmart/wireguard
    container_name: opensmart-wireguard
    hostname: wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - SERVER_IP=${SERVER_IP:-SERVER_IP}
    volumes:
      - ./volumes/data:/data
    ports:
      - "51820:51820/udp"
    networks:
      - opensmart
    restart: unless-stopped

networks:
  opensmart:
    external: true
    name: opensmart
