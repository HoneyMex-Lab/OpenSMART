[default]
### OpenSearch backend (overridden per-service via ARKIME__elasticsearch env)
elasticsearch=http://localhost:9200

### Capture interface
interface=eth0
snapLen=32768
pcapReadMethod=libpcap
pcapBufferSize=33554432
parsersDir=/opt/arkime/parsers
pluginsDir=/opt/arkime/plugins

### PCAP storage (inside mounted /data volume)
pcapDir=/data/raw

### Processing (host has 8GB RAM / 6 vCPU)
packetThreads=2
### OUI/RIR/GeoIP enrichment files are not bundled in the image.
### To enable, run inside the container: /opt/arkime/bin/arkime_update_geo.sh
### then set ouiFile/rirFile/geoLite2* accordingly.

### Drop privileges
dropUser=nobody
dropGroup=daemon
